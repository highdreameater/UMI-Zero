[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bare_hand_robotics"
version = "0.1.0"
description = "Vision-based pipeline translating natural bare-hand human manipulation videos into robot-executable 3D motions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "pybullet>=3.2.5",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
